<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบจัดตารางสอนอัตโนมัติ</title>
  <meta name="description" content="ระบบจัดตารางสอนอัตโนมัติด้วยปัญญาประดิษฐ์ นำเข้า Excel/CSV/JSON/PDF ส่งออก PDF/Excel">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f73'/%3E%3Cpath d='M8 10h16M8 16h16M8 22h10' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script src="lib/jszip.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">ข้ามไปเนื้อหา</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/import" aria-label="หน้าแรก">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="8"/><path d="M9 11h14M9 16h14M9 21h8"/></svg>
        </span>
        <span class="brand-text">
          <strong>ระบบจัดตารางสอนอัตโนมัติ</strong>
          <small id="brand-sub">AI Timetable Scheduler</small>
        </span>
      </a>
      <div class="top-actions">
        <span id="store-status" class="pill" title="สถานะการบันทึกข้อมูล"></span>
        <button id="btn-user" class="btn ghost sm" hidden></button>
        <button id="btn-help" class="btn help" type="button" aria-haspopup="dialog">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M12 7.5a2 2 0 1 1 1.5 1.94c-.9.24-1.5.8-1.5 1.56v.5M12 14.5v.01"/></svg>
          <span class="lbl-long">คู่มือการใช้งาน</span><span class="lbl-short">คู่มือ</span>
        </button>
      </div>
    </div>
    <nav class="steps" aria-label="ขั้นตอน">
      <a href="#/import" data-route="import"><b>1</b><span>นำเข้าข้อมูล</span></a>
      <a href="#/schedule" data-route="schedule"><b>2</b><span>จัดตาราง</span></a>
      <a href="#/results" data-route="results"><b>3</b><span>ตารางผลลัพธ์</span></a>
      <a href="#/history" data-route="history"><b>4</b><span>ประวัติ</span></a>
    </nav>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="foot">
    <span>ระบบจัดตารางสอนอัตโนมัติ · เวลาเรียน จันทร์-ศุกร์ 08.00-17.00 น. พักเที่ยง 12.00-13.00 น.</span>
    <span>Planner · Builder · Repairer · Inspector</span>
  </footer>

  <!-- คู่มือ -->
  <div id="help" class="drawer" role="dialog" aria-modal="true" aria-labelledby="help-title" hidden>
    <div class="drawer-backdrop" data-close></div>
    <aside class="drawer-panel">
      <div class="drawer-head">
        <h2 id="help-title">คู่มือการใช้งาน</h2>
        <button class="btn ghost sm" data-close aria-label="ปิดคู่มือ">ปิด</button>
      </div>
      <div class="drawer-body" id="help-body"></div>
    </aside>
  </div>

  <!-- กล่องโต้ตอบทั่วไป -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel"><div id="modal-body"></div></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="print-root" aria-hidden="true"></div>
</body>
</html>
